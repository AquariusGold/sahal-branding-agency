<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>{% block title %}My Portal{% endblock %}</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --clr-bg: #f8fafc;
            --clr-accent: #6366f1;
            --clr-card: #ffffff;
            --clr-text-main: #1e293b;
            --clr-text-muted: #64748b;
            --clr-border: #e2e8f0;
            --safe-bottom: env(safe-area-inset-bottom);
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--clr-bg);
            color: var(--clr-text-main);
            padding-bottom: calc(85px + var(--safe-bottom));
        }

        .mobile-header {
            padding: 1.25rem 1.5rem;
            background: rgba(248, 250, 252, 0.9);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 1000;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: calc(75px + var(--safe-bottom));
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-top: 1px solid var(--clr-border);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding-bottom: var(--safe-bottom);
            z-index: 1000;
        }

        .nav-item-mobile {
            text-decoration: none;
            color: var(--clr-text-muted);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            font-size: 0.7rem;
            font-weight: 600;
            transition: 0.2s;
        }

        .nav-item-mobile i {
            font-size: 1.4rem;
        }

        .nav-item-mobile.active {
            color: var(--clr-accent);
        }

        .card-client-mobile {
            background: var(--clr-card);
            border-radius: 20px;
            padding: 1.25rem;
            border: 1px solid var(--clr-border);
            margin-bottom: 1rem;
        }

    </style>
    {% block head %}{% endblock %}
</head>
<body>

    <header class="mobile-header">
        <div class="d-flex align-items-center gap-2">
            <div class="bg-indigo-subtle rounded-circle p-2"><i class="bi bi-person-fill text-indigo"></i></div>
            <span class="fw-bold">My Workspace</span>
        </div>
        <a href="{{ url_for('auth.logout') }}" class="text-danger small fw-bold text-decoration-none">Sign Out</a>
    </header>

    <div class="container py-4">
        {% block content %}{% endblock %}
    </div>

    <nav class="bottom-nav">
        <a href="{{ url_for('user_dashboard.dashboard') }}" class="nav-item-mobile {% block nav_dashboard %}{% endblock %}">
            <i class="bi bi-house-door-fill"></i>
            <span>Home</span>
        </a>
        <a href="{{ url_for('services.list_orders') }}" class="nav-item-mobile {% block nav_orders %}{% endblock %}">
            <i class="bi bi-wallet2"></i>
            <span>Bills</span>
        </a>
        <a href="#" class="nav-item-mobile">
            <i class="bi bi-chat-dots-fill"></i>
            <span>Talk</span>
        </a>
        <a href="#" class="nav-item-mobile">
            <i class="bi bi-gear-fill"></i>
            <span>Settings</span>
        </a>
    </nav>

    <style>
        .bg-indigo-subtle { background-color: rgba(99, 102, 241, 0.1); }
        .text-indigo { color: #6366f1; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
