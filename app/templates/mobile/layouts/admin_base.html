<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>{% block title %}Admin HQ{% endblock %}</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --clr-bg: #f8fafc;
            --clr-accent: #f5365c;
            --clr-card: #ffffff;
            --clr-text-main: #0f172a;
            --clr-text-muted: #64748b;
            --clr-border: #e2e8f0;
            --safe-bottom: env(safe-area-inset-bottom);
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--clr-bg);
            color: var(--clr-text-main);
            padding-bottom: calc(85px + var(--safe-bottom));
        }

        .mobile-header {
            padding: 1.5rem;
            background: rgba(248, 250, 252, 0.9);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 1000;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: calc(75px + var(--safe-bottom));
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-top: 1px solid var(--clr-border);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding-bottom: var(--safe-bottom);
            z-index: 1000;
            box-shadow: 0 -4px 20px rgba(0,0,0,0.03);
        }

        .nav-item-mobile {
            text-decoration: none;
            color: var(--clr-text-muted);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            font-size: 0.7rem;
            font-weight: 600;
            transition: 0.2s;
        }

        .nav-item-mobile i {
            font-size: 1.4rem;
        }

        .nav-item-mobile.active {
            color: var(--clr-accent);
        }

        .card-mobile-stat {
            background: var(--clr-card);
            border-radius: 20px;
            padding: 1.25rem;
            border: 1px solid var(--clr-border);
            box-shadow: 0 2px 8px rgba(0,0,0,0.02);
            margin-bottom: 1rem;
        }

        .btn-action-mobile {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #fff;
            border: 1px solid var(--clr-border);
            color: var(--clr-text-main);
        }

    </style>
    {% block head %}{% endblock %}
</head>
<body>

    <header class="mobile-header">
        <img src="{{ url_for('static', filename='images/Logo Color.png') }}" height="28" alt="Logo">
        <div class="d-flex gap-2">
            <button class="btn-action-mobile"><i class="bi bi-bell"></i></button>
            <a href="{{ url_for('auth.logout') }}" class="btn-action-mobile text-danger"><i class="bi bi-box-arrow-right"></i></a>
        </div>
    </header>

    <div class="container py-4">
        {% block content %}{% endblock %}
    </div>

    <nav class="bottom-nav">
        <a href="{{ url_for('admin_dashboard.dashboard') }}" class="nav-item-mobile {% block nav_dashboard %}{% endblock %}">
            <i class="bi bi-grid-fill"></i>
            <span>Dash</span>
        </a>
        <a href="{{ url_for('admin.list_orders') }}" class="nav-item-mobile {% block nav_orders %}{% endblock %}">
            <i class="bi bi-receipt"></i>
            <span>Orders</span>
        </a>
        <a href="{{ url_for('admin_dashboard.users') }}" class="nav-item-mobile {% block nav_users %}{% endblock %}">
            <i class="bi bi-people-fill"></i>
            <span>Users</span>
        </a>
        <a href="{{ url_for('main.index') }}" class="nav-item-mobile">
            <i class="bi bi-globe"></i>
            <span>Site</span>
        </a>
    </nav>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
